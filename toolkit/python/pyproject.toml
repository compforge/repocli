[project]
name = "compforge-repocli"
version = "0.4.0"
description = "Native repository inspection, content identity, Git and Forge operations"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["harness-common>=0.5.1,<0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["repocli"]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "mypy>=1.15,<2"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
strict = true

[[tool.mypy.overrides]]
module = "harness_common.*"
follow_untyped_imports = true
