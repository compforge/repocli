[project]
name = "compforge-repocli"
version = "0.8.0"
description = "Native repository inspection, content identity, Git and Forge operations"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["harness-common @ git+https://github.com/compforge/quality-harness.git@6cbaf18ef6a675131c56f1b84f3b720cca231669#subdirectory=sdks/python/common", "pyyaml>=6,<7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["repocli"]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "mypy>=1.15,<2", "types-PyYAML>=6,<7"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
strict = true

[[tool.mypy.overrides]]
module = "harness_common.*"
follow_untyped_imports = true

[tool.hatch.metadata]
allow-direct-references = true
