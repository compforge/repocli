name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.work
          cache-dependency-path: |
            toolkit/go/go.sum
            apps/cli/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify release version
        run: test "$GITHUB_REF_NAME" = "v$(cat VERSION)"
      - name: Verify published Go module tags
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          version="$(cat VERSION)"
          dependency="$(cd apps/cli && go mod edit -json | jq -r '.Require[] | select(.Path == "github.com/compforge/repocli/toolkit/go") | .Version')"
          test "$dependency" = "v$version"
          for prefix in toolkit/go apps/cli; do
            git fetch origin "refs/tags/$prefix/$TAG:refs/tags/$prefix/$TAG"
            test "$(git rev-parse "$prefix/$TAG^{commit}")" = "$(git rev-parse HEAD)"
          done
      - run: npm install --prefix toolkit/typescript --ignore-scripts
      - run: make lint test
      - name: Build archives
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          mkdir -p release
          for os in linux darwin; do
            for arch in amd64 arm64; do
              CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath -ldflags "-s -w -X github.com/compforge/repocli/apps/cli/internal/cli.Version=$(cat VERSION)" -o release/repocli ./apps/cli/cmd/repocli
              tar -czf "release/repocli_${VERSION}_${os}_${arch}.tar.gz" -C release repocli
            done
          done
          rm release/repocli
          (cd release && sha256sum *.tar.gz > checksums.txt)
      - name: Verify published CLI installation
        env:
          GOWORK: 'off'
          GOPROXY: direct
          TAG: ${{ github.ref_name }}
        run: |
          GOBIN="$RUNNER_TEMP/repocli-install" go install "github.com/compforge/repocli/apps/cli/cmd/repocli@$TAG"
          test "$("$RUNNER_TEMP/repocli-install/repocli" version)" = "repocli version $(cat VERSION)"
      - name: Publish tagged binaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/* --verify-tag --generate-notes
