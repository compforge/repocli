name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Verify release version
        run: test "$GITHUB_REF_NAME" = "v$(cat VERSION)"
      - run: make lint test
      - name: Build archives
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          mkdir -p release
          for os in linux darwin; do
            for arch in amd64 arm64; do
              CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath -ldflags "-s -w" -o release/repocli .
              tar -czf "release/repocli_${VERSION}_${os}_${arch}.tar.gz" -C release repocli
            done
          done
          rm release/repocli
          (cd release && sha256sum *.tar.gz > checksums.txt)
      - name: Publish tagged binaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/* --verify-tag --generate-notes
